name: Deploy Infrastructure (IaC)

on:
  workflow_dispatch:
    inputs:
      deploy_dev:
        description: 'Deploy Development (DEV) Environment'
        required: true
        default: true
        type: boolean
      deploy_test:
        description: 'Deploy Test (TEST) Environment'
        required: true
        default: true
        type: boolean
      deploy_prod:
        description: 'Deploy Production (PROD) Environment'
        required: true
        default: false
        type: boolean
          
permissions:
  id-token: write # Required for Azure OIDC authentication
  contents: read

env:
  TF_LOG: INFO
  TF_WORKING_DIR: 'IaC'
  # Secrets must be set in GitHub Actions Secrets
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  # Database password secret
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

jobs:
  # ===========================================================================
  # DEV ENVIRONMENT
  # ===========================================================================
  plan-dev:
    if: github.event.inputs.deploy_dev == 'true'
    name: Dev - Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v3

      - name: Azure Login via OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true
            
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: latest

      - name: Terraform Init
        run: terraform init -backend-config="variables/backend-dev.tfvars"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file="variables/dev.tfvars" -out=dev.tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-tfplan
          path: ${{ env.TF_WORKING_DIR }}/dev.tfplan

  deploy-dev:
    needs: plan-dev
    name: Dev - Apply
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v3

      - name: Azure Login via OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true  
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Download Plan Artifact
        uses: actions/download-artifact@v3
        with:
          name: dev-tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        run: terraform init -backend-config="variables/backend-dev.tfvars"

      - name: Terraform Apply
        run: terraform apply -auto-approve dev.tfplan

  # ===========================================================================
  # TEST ENVIRONMENT
  # ===========================================================================
  plan-test:
    needs: [deploy-dev]
    if: |
      github.event.inputs.deploy_test == 'true' && (needs.deploy-dev.result == 'success' || needs.deploy-dev.result == 'skipped')
    name: Test - Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v3
        
      - name: Azure Login via OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true
            
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init -backend-config="variables/backend-test.tfvars"

      - name: Terraform Plan
        run: terraform plan -var-file="variables/test.tfvars" -out=test.tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-tfplan
          path: ${{ env.TF_WORKING_DIR }}/test.tfplan

  deploy-test:
    needs: plan-test
    name: Test - Apply
    runs-on: ubuntu-latest
    environment: test
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v3

      - name: Azure Login via OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Download Plan Artifact
        uses: actions/download-artifact@v3
        with:
          name: test-tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        run: terraform init -backend-config="variables/backend-test.tfvars"

      - name: Terraform Apply
        run: terraform apply -auto-approve test.tfplan

  # ===========================================================================
  # PROD ENVIRONMENT
  # Runs only if 'all' is selected or 'prod' is selected.
  # ===========================================================================
  plan-prod:
    needs: [deploy-test]
    if: |
      github.event.inputs.deploy_prod == 'true' && (needs.deploy-test.result == 'success' || needs.deploy-test.result == 'skipped')
    name: Prod - Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v3
        
      - name: Azure Login via OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init -backend-config="variables/backend-prod.tfvars"

      - name: Terraform Plan
        run: terraform plan -var-file="variables/prod.tfvars" -out=prod.tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-tfplan
          path: ${{ env.TF_WORKING_DIR }}/prod.tfplan

  deploy-prod:
    needs: plan-prod
    name: Prod - Apply
    runs-on: ubuntu-latest
    environment: prod # <--- Configure strict Environment Protection rules for 'prod'
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v3
        
      - name: Azure Login via OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Download Plan Artifact
        uses: actions/download-artifact@v3
        with:
          name: prod-tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        run: terraform init -backend-config="variables/backend-prod.tfvars"

      - name: Terraform Apply
        run: terraform apply -auto-approve prod.tfplan